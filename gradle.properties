# JVM 参数：堆内存不要太小，否则编译 Kotlin + 处理依赖会 OOM
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# 使用 AndroidX（新工程必须为 true）
android.useAndroidX=true
# 只生成当前模块的 R 类，加快编译
android.nonTransitiveRClass=true
# 并行构建
org.gradle.parallel=true
org.gradle.caching=true
# Kotlin 代码风格
kotlin.code.style=official

# 本工程位于含中文字符的路径（桌面/操作系统综合实验），AGP 默认会直接拒绝构建。
# 该开关跳过路径检查；本工程不使用 NDK/CMake，实测 aapt2/d8 可正常处理 UTF-8 路径。
android.overridePathCheck=true
